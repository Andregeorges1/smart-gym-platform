<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090d" />
    <meta
      name="description"
      content="A connected gym experience. Explore training, bookings, coaching, rewards and gym operations in the Smart Gym interactive demo."
    />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("forma-orbit-theme") === "light"
            ? "light"
            : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
      document.querySelector('meta[name="theme-color"]').content =
        document.documentElement.dataset.theme === "light"
          ? "#f7f6fa"
          : "#08090d";
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>FORMA / ORBIT — Beyond limits.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800;900&family=Readex+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
